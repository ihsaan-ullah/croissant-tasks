# Nginx configuration for Croissant Task Index
# Place this file at /etc/nginx/sites-available/croissant-tasks
# Then create symlink: sudo ln -s /etc/nginx/sites-available/croissant-tasks /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

# Upstream backend
upstream croissant_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain name, e.g., tasks.example.com
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # For now, serve HTTP directly
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Static files - let backend serve them (simpler, avoids permission issues)
    # If you want nginx to serve static files directly, uncomment below and fix permissions:
    # location /assets/ {
    #     alias /home/ubuntu/croissant-tasks/index/frontend/dist/assets/;
    #     limit_req zone=static_limit burst=20 nodelay;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
    
    # API endpoints with rate limiting
    location /tasks {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://croissant_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # All other requests (SPA routes and static files)
    location / {
        proxy_pass http://croissant_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

